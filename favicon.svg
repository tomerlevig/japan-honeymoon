      <stop offset="0" stop-color="#fdf1ea"/>
      <stop offset="1" stop-color="#f6d3d9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe8ee"/>
      <stop offset="1" stop-color="#ffd0dc"/>
